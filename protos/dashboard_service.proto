syntax = "proto3";

package dashboard;

import "google/protobuf/timestamp.proto";

service DashboardService {
    // Estadísticas agregadas de solo lectura para la pantalla de inicio.
    rpc GetDashboardStats (GetDashboardStatsRequest) returns (GetDashboardStatsResponse);

    // Reporte de cierre de período (BR-DASH-002): agregados acotados a un rango
    // de fechas [start_date, end_date], para presentar una vez cerrado el mes /
    // trimestre / año. A diferencia de GetDashboardStats (una foto del estado
    // actual), esto mide lo que *ocurrió* dentro del período.
    rpc GetPeriodReport (GetPeriodReportRequest) returns (GetPeriodReportResponse);

    // BR-DASH-003: estado de pago de los clientes, una fila por cliente con
    // cartera viva (al menos un préstamo ACTIVE o DEFAULTED). A diferencia de
    // GetDashboardStats (totales agregados) y de GetPeriodReport (lo ocurrido
    // en un rango), esto es un listado nominal: quién está al día y quién
    // debe, para llamar/gestionar la cobranza.
    rpc GetClientPaymentStatusReport (GetClientPaymentStatusReportRequest)
        returns (GetClientPaymentStatusReportResponse);

    // Cartera por vencer, pensado para pedirse desde la pantalla de Caja:
    // cuotas de préstamos ACTIVE que vencen dentro de los próximos N días
    // (hoy incluido) y todavía no están cubiertas. A diferencia de
    // GetClientPaymentStatusReport (que mira lo YA vencido), esto mira hacia
    // ADELANTE -- para que el cajero le recuerde el vencimiento al cliente
    // antes de que entre en mora. Se exporta únicamente como planilla Excel
    // del lado del cliente; no tiene versión PDF/DOCX.
    rpc GetUpcomingDueReport (GetUpcomingDueReportRequest)
        returns (GetUpcomingDueReportResponse);
}

message GetDashboardStatsRequest {
}

message GetDashboardStatsResponse {
    int32 total_clients_count = 1;
    int32 active_clients_count = 2;
    int32 pending_loans_count = 3;    // PENDING -- esperando aprobación
    int32 approved_loans_count = 4;   // APPROVED -- esperando desembolso
    int32 active_loans_count = 5;     // ACTIVE
    int32 paid_loans_count = 6;       // PAID
    int32 defaulted_loans_count = 7;  // DEFAULTED
    // EXPIRED (BR-LOAN-003). El nombre del campo sigue el LoanStatusEnum del
    // servidor; la etiqueta que ve el usuario es "Rechazados" (ver theme.py /
    // dashboard_view.py) -- decisión de producto, no un estado nuevo.
    int32 expired_loans_count = 8;
    string total_disbursed = 9;            // Suma de capital de préstamos ACTIVE/PAID/DEFAULTED
    string total_outstanding_balance = 10; // Suma del saldo restante de préstamos ACTIVE
    // BR-DASH-001 -- "Monto total de mora": suma de lo vencido e impago de
    // todos los préstamos ACTIVE (mismo cálculo por préstamo que
    // GetLoanByIdResponse.overdue_amount, BR-LOAN-009). Es lo que la empresa
    // debería recibir cuando los deudores se pongan al día con sus cuotas
    // vencidas -- NO es total_outstanding_balance, que incluye además todas
    // las cuotas futuras todavía no vencidas.
    string total_overdue_amount = 11;
    int32 overdue_loans_count = 12;   // Préstamos ACTIVE con al menos una cuota vencida impaga
}

// BR-DASH-002. Ambas fechas en formato YYYY-MM-DD (formato de cable, igual que
// el resto del contrato -- la UI muestra DD/MM/AAAA y traduce en el borde).
// Rango inclusivo en ambos extremos.
message GetPeriodReportRequest {
    string start_date = 1;
    string end_date = 2;
}

message GetPeriodReportResponse {
    // Eco del rango efectivamente aplicado (YYYY-MM-DD), para que el documento
    // generado no dependa de lo que el cliente creía haber pedido.
    string start_date = 1;
    string end_date = 2;

    // Altas ocurridas dentro del período
    int32 clients_registered = 3;      // Client.created_at dentro del rango
    int32 loans_created = 4;           // Loan.created_at dentro del rango
    int32 loans_approved = 5;          // Loan.approved_at dentro del rango
    string principal_created = 6;      // Capital solicitado en los préstamos creados
    string principal_approved = 7;     // Capital de los préstamos aprobados

    // Desembolsos ocurridos dentro del período (Loan.disbursed_at en el rango).
    // Es el dinero que realmente salió de la entidad, y es lo único de este
    // bloque que lo mide: `principal_approved` es una decisión, no una salida
    // de caja -- un préstamo aprobado puede no desembolsarse nunca (BR-LOAN-003
    // lo vence a los 30 días). Los préstamos desembolsados antes de que
    // existiera Loan.disbursed_at no tienen la marca y no entran en ningún
    // período; ver la nota de la migración.
    int32 loans_disbursed = 15;
    string principal_disbursed = 16;   // Capital entregado al cliente

    // Cobranza ocurrida dentro del período
    int32 payments_count = 8;          // LoanPayment.paid_at dentro del rango
    string payments_total = 9;         // Suma de LoanPayment.amount

    // Cierre de préstamos dentro del período (por fecha del hecho que los cerró)
    int32 loans_paid = 10;             // Pasaron a PAID (último pago dentro del rango)

    // Foto al cierre del período (estado al momento de generar el reporte)
    int32 active_loans_at_close = 11;
    string outstanding_at_close = 12;  // Saldo pendiente total de los ACTIVE
    string overdue_at_close = 13;      // Monto total de mora (BR-DASH-001)
    int32 overdue_loans_at_close = 14;
}

// BR-DASH-003.
message GetClientPaymentStatusReportRequest {
    // true = devolver únicamente los clientes con al menos una cuota vencida
    // impaga o un préstamo incumplido (la lista de gestión de cobranza).
    // false = todos los clientes con cartera viva.
    bool only_overdue = 1;
}

// Una fila por cliente. Los montos son strings decimales, igual que en el
// resto del contrato.
message ClientPaymentStatusRow {
    string client_id = 1;
    string client_name = 2;      // "Nombre Apellido"
    string national_id = 3;
    string phone_number = 4;
    int32 active_loans_count = 5;
    int32 defaulted_loans_count = 6;
    // Saldo pendiente sumado de sus préstamos ACTIVE (mismo cálculo que
    // GetLoanByIdResponse.remaining_balance).
    string outstanding_balance = 7;
    // Vencido e impago (BR-LOAN-009), sumado sobre sus préstamos ACTIVE.
    string overdue_amount = 8;
    int32 overdue_installments_count = 9;
    // Próxima cuota todavía impaga de toda su cartera activa: la más
    // temprana. "" cuando no queda ninguna (p. ej. solo tiene incumplidos).
    string next_due_date = 10;   // YYYY-MM-DD
    string next_due_amount = 11;
    // "AL_DIA" | "CUOTA_VENCIDA" | "INCUMPLIDO". INCUMPLIDO tiene prioridad:
    // un cliente con un préstamo DEFAULTED se informa así aunque el resto de
    // su cartera esté al día.
    string payment_status = 12;
}

message GetClientPaymentStatusReportResponse {
    // Momento en que se midió el estado -- el reporte es una foto de "ahora",
    // no de un período; el documento generado imprime esta fecha.
    google.protobuf.Timestamp generated_at = 1;
    bool only_overdue = 2;       // eco del filtro efectivamente aplicado
    repeated ClientPaymentStatusRow rows = 3;
    // Totales de las filas devueltas (no de toda la cartera): con only_overdue
    // activo describen únicamente el subconjunto en mora.
    int32 clients_count = 4;
    int32 overdue_clients_count = 5;
    string total_outstanding = 6;
    string total_overdue = 7;
}

message GetUpcomingDueReportRequest {
    // Días hacia adelante desde hoy (inclusive) a considerar. El cliente
    // siempre manda 7 hoy, pero el campo queda abierto en vez de hardcodear
    // la ventana en el servidor.
    int32 days_ahead = 1;
}

// Una fila por CUOTA próxima a vencer, no por cliente ni por préstamo: un
// cliente con dos préstamos activos, cada uno con una cuota dentro de la
// ventana, aparece dos veces -- cada fila es una factura distinta.
message UpcomingDueRow {
    string client_id = 1;
    string client_name = 2;      // "Nombre Apellido"
    string phone_number = 3;
    string loan_id = 4;
    int32 installment_number = 5;
    string due_date = 6;         // YYYY-MM-DD
    // Pendiente de esa cuota específica (no el total del préstamo), mismo
    // cálculo FIFO que BR-LOAN-009/BR-LOAN-010.
    string due_amount = 7;
    // Cuotas ya abonadas de ESE préstamo hasta ahora (para dar contexto de
    // cumplimiento junto al monto que se le va a cobrar).
    int32 installments_paid_count = 8;
    int32 term_months = 9;
}

message GetUpcomingDueReportResponse {
    // Momento en que se midió -- igual que BR-DASH-003, es una foto de
    // "ahora", no de un período.
    google.protobuf.Timestamp generated_at = 1;
    int32 days_ahead = 2;        // eco de la ventana efectivamente aplicada
    repeated UpcomingDueRow rows = 3;
}
